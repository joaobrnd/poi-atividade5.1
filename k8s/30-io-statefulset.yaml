# Service headless: exigido pelo StatefulSet para dar identidade de rede ao pod.
# Nao expoe nada externamente - a exposicao fica em 31-io-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: io-service-headless
  namespace: poi
spec:
  clusterIP: None
  selector:
    app: io-service
  ports:
    - name: http
      port: 8003
      targetPort: 8003
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: io-service
  namespace: poi
  labels:
    app: io-service
spec:
  serviceName: io-service-headless
  replicas: 1
  selector:
    matchLabels:
      app: io-service
  template:
    metadata:
      labels:
        app: io-service
    spec:
      containers:
        - name: io-service
          image: stefaneguedes/poi-io-service:1.0.0
          env:
            - name: IO_DATA_DIR
              value: /data
          ports:
            - name: http
              containerPort: 8003
          volumeMounts:
            - name: dados
              mountPath: /data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
