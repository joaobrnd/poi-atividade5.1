apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-service
  namespace: poi
  labels:
    app: cpu-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpu-service
  template:
    metadata:
      labels:
        app: cpu-service
    spec:
      containers:
        - name: cpu-service
          image: stefaneguedes/poi-cpu-service:1.0.0
          ports:
            - name: http
              containerPort: 8001
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
