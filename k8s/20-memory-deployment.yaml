apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  namespace: poi
  labels:
    app: memory-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memory-service
  template:
    metadata:
      labels:
        app: memory-service
    spec:
      containers:
        - name: memory-service
          image: stefaneguedes/poi-memory-service:1.0.0
          env:
            - name: MEMORY_MAX_MB
              value: "1024"
          ports:
            - name: http
              containerPort: 8002
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
